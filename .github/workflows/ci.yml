name: CI

on:
  push:
    branches: [main, master]
    paths:
      - 'Back/MapifyBackend/**'
      - 'Front/Admin-panel/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'Back/MapifyBackend/**'
      - 'Front/Admin-panel/**'
      - '.github/workflows/ci.yml'

jobs:
  backend:
    name: Backend (build + integration tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Back/MapifyBackend/MapifyBackend.sln

      - name: Build
        run: dotnet build Back/MapifyBackend/MapifyBackend.sln -c Release --no-restore

      - name: Test
        run: dotnet test Back/MapifyBackend/MapifyBackend.IntegrationTests/MapifyBackend.IntegrationTests.csproj -c Release --no-build

  admin-panel:
    name: Admin panel (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Front/Admin-panel/admin-panel
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Front/Admin-panel/admin-panel/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
