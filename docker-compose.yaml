services:
  backend:
    build:
      context: ./Back/MapifyBackend
      dockerfile: DOCKERFILE
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - ASPNETCORE_ENVIRONMENT=Development
      # Admin API key. Defaults to the dev key; set your own in the root .env (ADMIN_API_KEY=...)
      - AdminApi__Key=${ADMIN_API_KEY:-mapify-dev-admin-key}
      - Cors__AllowedOrigins__0=http://localhost:5173
      - ConnectionStrings__Default=Data Source=/app/data/database.db
    volumes:
      - backend-data:/app/data
    networks:
      - mapify-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/strats"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend-tests:
    build:
      context: ./Back/MapifyBackend
      dockerfile: DOCKERFILE
      target: test-runner
    profiles:
      - test

  frontend:
    build:
      context: ./Front/Admin-panel
      dockerfile: DOCKERFILE
    ports:
      - "5173:5173"
    environment:
      # The admin panel sends this key in the X-Api-Key header; it must match the backend's AdminApi__Key.
      # Vite reads VITE_* when the dev server starts, so changing the key requires a restart.
      - VITE_API_KEY=${ADMIN_API_KEY:-mapify-dev-admin-key}
      - VITE_API_BASE_URL=http://localhost:5000
    volumes:
      - ./Front/Admin-panel/admin-panel:/app/admin-panel
      - /app/admin-panel/node_modules
    networks:
      - mapify-network
    depends_on:
      backend:
        condition: service_healthy

  telegram-bot:
    build:
      context: ./Front/Telegram
      dockerfile: DOCKERFILE
    # Bot token and settings live in Front/Telegram/.env (create it from Front/Telegram/.env.example).
    # Without TELEGRAM_BOT_TOKEN in that file the bot will not start.
    env_file:
      - path: ./Front/Telegram/.env
        required: false
    environment:
      # Inside the compose network the bot reaches the backend by service name.
      # This value overrides API_BASE_URL from Front/Telegram/.env
      - API_BASE_URL=http://backend:5000/api/
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mapify-network

networks:
  mapify-network:

volumes:
  backend-data:
