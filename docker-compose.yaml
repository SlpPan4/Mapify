services:
  backend:
    build:
      context: ./Back/MapifyBackend
      dockerfile: DOCKERFILE
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - ASPNETCORE_ENVIRONMENT=Development
      # Ключ админки. По умолчанию dev-ключ; свой ключ задай в корневом .env (ADMIN_API_KEY=...)
      - AdminApi__Key=${ADMIN_API_KEY:-mapify-dev-admin-key}
      - Cors__AllowedOrigins__0=http://localhost:5173
      - ConnectionStrings__Default=Data Source=/app/data/database.db
    volumes:
      - backend-data:/app/data
    networks:
      - mapify-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/strats"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend-tests:
    build:
      context: ./Back/MapifyBackend
      dockerfile: DOCKERFILE
      target: test-runner
    profiles:
      - test

  frontend:
    build:
      context: ./Front/Admin-panel
      dockerfile: DOCKERFILE
    ports:
      - "5173:5173"
    environment:
      # Админка шлёт этот ключ в заголовке X-Api-Key; должен совпадать с AdminApi__Key бэкенда.
      # Vite читает VITE_* при старте dev-сервера, поэтому после смены ключа нужен restart.
      - VITE_API_KEY=${ADMIN_API_KEY:-mapify-dev-admin-key}
      - VITE_API_BASE_URL=http://localhost:5000
    volumes:
      - ./Front/Admin-panel/admin-panel:/app/admin-panel
      - /app/admin-panel/node_modules
    networks:
      - mapify-network
    depends_on:
      backend:
        condition: service_healthy

  telegram-bot:
    build:
      context: ./Front/Telegram
      dockerfile: DOCKERFILE
    # Токен и настройки бота — в Front/Telegram/.env (создай из Front/Telegram/.env.example).
    # Без TELEGRAM_BOT_TOKEN в этом файле бот не запустится.
    env_file:
      - path: ./Front/Telegram/.env
        required: false
    environment:
      # Внутри compose-сети бот ходит на бэкенд по имени сервиса.
      # Это значение переопределяет API_BASE_URL из Front/Telegram/.env
      - API_BASE_URL=http://backend:5000/api/
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mapify-network

  discord-bot:
    build:
      context: ./Front/Discord
      dockerfile: DOCKERFILE
    # Токены и настройки бота — в Front/Discord/.env (создай из Front/Discord/.env.example).
    # Без DISCORD_TOKEN и DISCORD_CLIENT_ID в этом файле бот не запустится.
    # Ключ админки боту не нужен: он работает только с публичными эндпоинтами
    # (чтение стратегий + подача на модерацию через /api/submissions/strats).
    env_file:
      - path: ./Front/Discord/.env
        required: false
    environment:
      # Внутри compose-сети бот ходит на бэкенд по имени сервиса.
      # Это значение переопределяет API_BASE_URL из Front/Discord/.env
      - API_BASE_URL=http://backend:5000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mapify-network

networks:
  mapify-network:

volumes:
  backend-data:
